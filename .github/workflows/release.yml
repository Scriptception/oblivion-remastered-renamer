name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install Lua 5.3
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3
      - name: Test rename dialog isolation and game-thread access
        run: lua5.3 tests/rename_dialog.lua

  release:
    needs: regressions
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ('${{ github.ref_name }}' -ne "v$version") {
              throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }

      - name: Validate source contract
        shell: pwsh
        run: ./tools/validate.ps1

      - name: Parse Lua syntax
        shell: pwsh
        run: npx --yes luaparse@0.3.1 ./src/OblivionRenamer/scripts/main.lua | Out-Null

      - name: Check Lua formatting
        shell: pwsh
        run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check ./src/OblivionRenamer/scripts/main.lua ./tests/rename_dialog.lua

      - name: Build and verify package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $assets = @(Get-ChildItem -LiteralPath build -File | Where-Object {
              $_.Name -match '\.zip(?:\.sha256)?$'
          })
          if ($assets.Count -ne 2) {
              throw "Expected a ZIP and checksum, found $($assets.Count) release assets."
          }
          $arguments = @(
              'release', 'create', "v$version",
              '--verify-tag',
              '--title', "Oblivion Renamer $version",
              '--generate-notes'
          )
          if ($version.Contains('-')) {
              $arguments += '--prerelease'
          }
          $arguments += $assets.FullName
          gh @arguments
