name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate source contract
        shell: pwsh
        run: ./tools/validate.ps1

      - name: Parse Lua syntax
        shell: pwsh
        run: npx --yes luaparse@0.3.1 ./src/OblivionRenamer/scripts/main.lua | Out-Null

      - name: Check Lua formatting
        shell: pwsh
        run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check ./src/OblivionRenamer/scripts/main.lua

      - name: Build and verify package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OblivionRenamer-${{ github.sha }}
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error
          retention-days: 7
