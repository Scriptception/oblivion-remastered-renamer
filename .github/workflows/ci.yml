name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate source contract
        shell: pwsh
        run: ./tools/validate.ps1

      - name: Parse Lua syntax
        shell: pwsh
        run: npx --yes luaparse@0.3.1 ./src/OblivionRenamer/scripts/main.lua | Out-Null

      - name: Check Lua formatting
        shell: pwsh
        run: npx --yes @johnnymorganz/stylua-bin@2.5.2 --check ./src/OblivionRenamer/scripts/main.lua

      - name: Build and verify package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OblivionRenamer-${{ github.sha }}
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error
          retention-days: 7
